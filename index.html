<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kasir Barcode UMKM</title>

<style>

body{
font-family:Arial;
margin:0;
background:#f2f2f2;
padding:10px;
}

h2{
text-align:center;
}

#scanner{
width:100%;
height:250px;
background:black;
border-radius:10px;
overflow:hidden;
}

.card{
background:white;
padding:10px;
border-radius:10px;
margin-top:10px;
}

button{
width:100%;
padding:12px;
margin-top:10px;
border:none;
border-radius:8px;
background:#1f7a63;
color:white;
font-size:16px;
}

input{
width:100%;
padding:10px;
margin-top:5px;
margin-bottom:10px;
}

.item{
display:flex;
justify-content:space-between;
margin:5px 0;
}

.total{
font-size:20px;
font-weight:bold;
}

</style>
</head>

<body>

<h2>Kasir Barcode</h2>

<div id="scanner"></div>

<button onclick="startScanner()">Start Scan</button>

<div class="card">

<h3>Tambah Produk Baru</h3>

<input id="nama" placeholder="Nama Produk">
<input id="harga" placeholder="Harga">

<button onclick="simpanProduk()">Simpan Produk</button>

</div>

<div class="card">

<h3>Keranjang</h3>

<div id="cart"></div>

<div class="total">
Total : Rp <span id="total">0</span>
</div>

<button onclick="reset()">Transaksi Baru</button>

</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/quagga/0.12.1/quagga.min.js"></script>

<script>

let db = JSON.parse(localStorage.getItem("produk_db")||"{}")
let cart=[]
let lastBarcode=""

function startScanner(){

Quagga.init({

inputStream:{
name:"Live",
type:"LiveStream",
target:document.querySelector('#scanner'),
constraints:{facingMode:"environment"}
},

decoder:{
readers:["ean_reader","ean_8_reader","code_128_reader"]
}

},function(err){

if(err){console.log(err);return;}

Quagga.start()

})

Quagga.onDetected(function(result){

let code=result.codeResult.code

Quagga.stop()

handleBarcode(code)

})

}

function handleBarcode(code){

lastBarcode=code

if(db[code]){

addToCart(db[code].nama,db[code].harga)

}else{

alert("Produk belum ada, isi data produk")

}

}

function simpanProduk(){

let nama=document.getElementById("nama").value
let harga=parseInt(document.getElementById("harga").value)

db[lastBarcode]={nama:nama,harga:harga}

localStorage.setItem("produk_db",JSON.stringify(db))

addToCart(nama,harga)

}

function addToCart(nama,harga){

cart.push({nama,harga})

render()

}

function render(){

let el=document.getElementById("cart")
el.innerHTML=""

let total=0

cart.forEach(function(i){

total+=i.harga

let div=document.createElement("div")
div.className="item"

div.innerHTML="<span>"+i.nama+"</span><span>Rp "+i.harga+"</span>"

el.appendChild(div)

})

document.getElementById("total").innerText=total

}

function reset(){

cart=[]

render()

}

</script>

</body>
</html>
